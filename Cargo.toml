[package]
name = "hw-monitor"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "hw-monitor-native"
path = "src/main.rs"

[[bin]]
name = "hw-monitor-web"
path = "src/bin/web.rs"

[lib]
name = "hw_monitor"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.6", features = ["ws"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
